[project]
name = "fastapi-migrations"
version = "0.0.6.dev2"
description = "A small integration between Fastapi and Alembic."
authors = [{ name = "Ariel Carvajal", email = "arie.cbpro@gmail.com" }]

readme = "README.md"
license = "MIT"
classifiers=[
    'Environment :: Web Environment',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Internet :: WWW/HTTP :: Dynamic Content',
    'Topic :: Software Development :: Libraries :: Python Modules'
]

requires-python = ">=3.7"
dependencies = [
    "alembic>=1.8.0",
    "typer>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.3",
]

[dependency-groups]
quality = [
    "flake8>=3.8.4",
    "mypy>=0.812",
    "pylint>=2.7.1",
    "autopep8>=1.5.5",
]
tests = [
    "coverage>=7.2.7",
    "pytest>=6.2.2",
]
dev = [
    { include-group = "quality" },
    { include-group = "tests" },
]

[project.urls]
Code = 'https://github.com/patiprecios/fastapi-migrations'
Issues = 'https://github.com/patiprecios/fastapi-migrations/issues'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "fastapi_migrations/*.py",
  "fastapi_migrations/templates/*",
]
